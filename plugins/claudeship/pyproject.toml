[project]
name = "claudeship"
version = "0.0.1"
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: tests that require external processes (daemon, shell scripts)",
]

[tool.ruff.lint]
ignore = ["E501"]
