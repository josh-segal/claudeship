name: Release ClaudeNotifier

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        run: |
          mkdir -p ClaudeNotifier.app/Contents/MacOS
          mkdir -p ClaudeNotifier.app/Contents/Resources

          # Compile
          swiftc -swift-version 5 \
            notifier/ClaudeNotifier.swift \
            -o ClaudeNotifier.app/Contents/MacOS/ClaudeNotifier \
            -framework Cocoa

          # Info.plist with version stamped
          sed "s/\${VERSION}/${{ steps.version.outputs.version }}/g" \
            notifier/Info.plist > ClaudeNotifier.app/Contents/Info.plist

          # Codesign
          codesign --force --deep --sign - ClaudeNotifier.app

      - name: Package
        run: zip -r ClaudeNotifier.zip ClaudeNotifier.app

      - name: Compute SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 ClaudeNotifier.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ClaudeNotifier.zip

      - name: Update Homebrew cask
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/claude-notifier.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/claude-notifier.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/claude-notifier.rb
          git commit -m "update cask to v$VERSION"
          git push origin HEAD:main
